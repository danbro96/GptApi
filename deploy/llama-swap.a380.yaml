# Local GPU encoders (Vulkan) — embed + rerank only, ~2 GB VRAM so the GPU can be shared with
# other workloads (e.g. video transcode). GGUFs: Qwen official embedding; ggml-org reranker.
healthCheckTimeout: 120

groups:
  "encoders":              # embed + rerank co-resident (both single-pass, ~1.5 GB total)
    swap: false
    members: ["qwen3-embedding-0.6b", "qwen3-reranker-0.6b"]

models:
  "qwen3-embedding-0.6b":  # bi-encoder; retrieval top-K
    cmd: >
      llama-server --port ${PORT} --model /cache/Qwen3-Embedding-0.6B-Q8_0.gguf
      --embeddings --pooling last --n-gpu-layers 999 --ctx-size 8192
    ttl: 0

  "qwen3-reranker-0.6b":   # cross-encoder; re-scores the top-K
    cmd: >
      llama-server --port ${PORT} --model /cache/qwen3-reranker-0.6b-q8_0.gguf
      --reranking --pooling rank --n-gpu-layers 999 --ctx-size 8192
    ttl: 0
