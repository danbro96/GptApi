# Reference Compose for GptApi — gpt-api (.NET gateway) + two local llama-swap workers.
# The gateway routes each request's `model` to a backend (see Llama__Routes below):
#   gpu    → a remote GPU host reached by URL (set GPU_WORKER_URL) — not a container here.
#   nasGpu → gpt-worker-a380 (a local GPU, llama.cpp Vulkan) — light encoders.
#   nasCpu → gpt-worker (CPU) — triage + the workhorse fallback when the GPU host is offline.
# Every host/port/URL is an overridable ${VAR:-default} sample; values marked :?required must be set.
# Model lists / GGUF filenames / per-model flags live in the deploy/llama-swap*.yaml files.
services:
  gpt-api:
    image: danbro96/gpt-api:${IMAGE_TAG:-latest}
    container_name: gpt-api
    environment:
      # --- Worker backends (name → URL) ---
      Llama__Backends__0__Name: gpu
      Llama__Backends__0__Url: ${GPU_WORKER_URL:-http://gpu-host:9000}
      Llama__Backends__1__Name: nasGpu
      Llama__Backends__1__Url: http://gpt-worker-a380:9000
      Llama__Backends__2__Name: nasCpu
      Llama__Backends__2__Url: http://gpt-worker:9000
      # Always-on backend for unrouted model ids + the readiness probe.
      Llama__DefaultBackend: nasCpu
      # --- Per-model routing (Model → Backend [+ Fallback on transport failure]) ---
      Llama__Routes__0__Model: qwen3-14b
      Llama__Routes__0__Backend: gpu
      Llama__Routes__0__Fallback: nasCpu
      Llama__Routes__1__Model: qwen3-embedding-0.6b
      Llama__Routes__1__Backend: nasGpu
      Llama__Routes__1__Fallback: nasCpu
      Llama__Routes__2__Model: qwen3-reranker-0.6b
      Llama__Routes__2__Backend: nasGpu
      Llama__Routes__2__Fallback: nasCpu
      Llama__Routes__3__Model: qwen3-1.7b
      Llama__Routes__3__Backend: nasCpu
      # Heavy tier on the GPU host's CPU (MoE, queued). No fallback — when that host is
      # offline the caller queues heavy work rather than running it elsewhere.
      Llama__Routes__4__Model: gpt-oss-20b
      Llama__Routes__4__Backend: gpu
      # Top tier — gpt-oss-120b on the always-on CPU host (pure-CPU, load-on-demand). No fallback.
      Llama__Routes__5__Model: gpt-oss-120b
      Llama__Routes__5__Backend: nasCpu
      # --- Named tier aliases (caller-facing name → concrete model id) ---
      # Callers pick a semantic tier; the gateway rewrites it to the GGUF id before routing, so a
      # tier can be re-pointed here without touching consumers. (Defaults also ship in appsettings.json.)
      Llama__Aliases__assistant-fast: qwen3-1.7b
      Llama__Aliases__assistant-reasoning: gpt-oss-120b
      Llama__Aliases__assistant-balanced: qwen3-14b
      Llama__Aliases__embed: qwen3-embedding-0.6b
      Llama__Aliases__rerank: qwen3-reranker-0.6b
      Llama__RequestTimeoutSeconds: ${REQUEST_TIMEOUT:-300}
      Auth__ApiKeys__0__Key: ${GPT_API_KEY:?required}
      Auth__ApiKeys__0__Name: ${GPT_API_KEY_NAME:-prod}
      # Per-key quotas (optional; omit to use the RateLimit__RequestsPerMinute fallback below).
      # Priority is recorded for observability; cross-key scheduling is a llama-swap follow-up.
      #   Auth__ApiKeys__0__RequestsPerMinute: 120
      #   Auth__ApiKeys__0__Priority: high            # Low | Normal | High
      #   Auth__ApiKeys__0__DailyTokenBudget: 20000000
      # Add more keys, each with its own quota, so consumers don't starve each other:
      #   Auth__ApiKeys__1__Key: ${MTG_API_KEY}
      #   Auth__ApiKeys__1__Name: mtg
      #   Auth__ApiKeys__1__RequestsPerMinute: 60
      #   Auth__ApiKeys__2__Key: ${DEMOS_API_KEY}
      #   Auth__ApiKeys__2__Name: demos
      #   Auth__ApiKeys__2__RequestsPerMinute: 20
      Auth__AllowedOrigins__0: ${ALLOWED_ORIGIN:-}
      # Fallback requests/min for any key without its own Auth__ApiKeys__N__RequestsPerMinute.
      RateLimit__RequestsPerMinute: ${RATE_LIMIT:-30}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-300000}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=prod}
    ports:
      - "${HOST_PORT:-40480}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/readyz || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Only the always-on CPU worker gates startup. A GPU worker being down must NOT block the
    # gateway — the router fails over.
    depends_on:
      gpt-worker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - telemetry

  gpt-worker:
    # CPU llama-swap: triage (qwen3-1.7b, kept resident) + the workhorse fallback
    # (qwen3-14b, slow) + CPU copies of the encoders for GPU-pressure failover.
    image: ghcr.io/mostlygeek/llama-swap:cpu
    container_name: gpt-worker
    command:
      - "-config"
      - "/config.yaml"
      - "-listen"
      - "0.0.0.0:9000"
    volumes:
      - ${CACHE_DIR:-./cache}:/cache
      - ${CPU_CONFIG:-./llama-swap.yaml}:/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  gpt-worker-a380:
    # Local GPU llama-swap, Vulkan backend — serves only the small encoders (embed/rerank,
    # ~2 GB VRAM) so it can share a GPU that also does other work (e.g. video transcode).
    # Image must bundle a Vulkan llama-server build; verify the exact tag for your setup.
    image: ${GPU_ENCODER_IMAGE:-ghcr.io/mostlygeek/llama-swap:vulkan}
    container_name: gpt-worker-a380
    command:
      - "-config"
      - "/config.yaml"
      - "-listen"
      - "0.0.0.0:9000"
    devices:
      - /dev/dri:/dev/dri          # the GPU; share it with other GPU workloads
    group_add:
      - video                                                    # static GID 44 in Debian base — resolves in-image
      - ${RENDER_GID:?run: stat -c %g /dev/dri/renderD128 on the host}   # dynamic GID, absent in-image — must be numeric
    volumes:
      - ${CACHE_DIR:-./cache}:/cache
      - ${ENCODER_CONFIG:-./llama-swap.a380.yaml}:/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  default:
    driver: bridge
  telemetry:
    external: true
    name: ${TELEMETRY_NETWORK:-telemetry}
