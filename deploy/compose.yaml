services:
  gpt-api:
    image: danbro96/gpt-api:${IMAGE_TAG:-latest}
    container_name: gpt-api
    environment:
      Llama__WorkerUrl: http://gpt-worker:9000
      Llama__RequestTimeoutSeconds: ${REQUEST_TIMEOUT:-300}
      Auth__ApiKeys__0__Key: ${GPT_API_KEY:?required}
      Auth__ApiKeys__0__Name: ${GPT_API_KEY_NAME:-prod}
      Auth__AllowedOrigins__0: ${ALLOWED_ORIGIN:-}
      RateLimit__RequestsPerMinute: ${RATE_LIMIT:-30}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=prod,host.name=medelynas}
    ports:
      - "${HOST_PORT:-40480}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      gpt-worker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - medelynas_telemetry

  gpt-worker:
    # llama-swap proxies in front of llama-server, loading/unloading models on
    # demand so only one is resident at a time. The :cpu image bundles a CPU build
    # of llama-server. Models declared in llama-swap.yaml.
    image: ghcr.io/mostlygeek/llama-swap:cpu
    container_name: gpt-worker
    command:
      - "-config"
      - "/config.yaml"
      - "-listen"
      - "0.0.0.0:9000"
    volumes:
      - /mnt/tank2/appdata/gpt_api/cache:/cache
      - /mnt/tank2/appdata/gpt_api/llama-swap.yaml:/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      # llama-swap itself starts in <1s; the model-load wait happens on first
      # request, gated by healthCheckTimeout in llama-swap.yaml.
      start_period: 30s
    restart: unless-stopped

networks:
  default:
    driver: bridge
  medelynas_telemetry:
    external: true
    name: medelynas_telemetry
