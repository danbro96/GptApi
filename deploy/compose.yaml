services:
  gpt-api:
    image: danbro96/gpt-api:${IMAGE_TAG:-latest}
    container_name: gpt-api
    environment:
      Llama__WorkerUrl: http://gpt-worker:9000
      Llama__RequestTimeoutSeconds: ${REQUEST_TIMEOUT:-300}
      Llama__ServedModelId: ${SERVED_MODEL_ID:-qwen3.6-35b-a3b}
      Auth__ApiKeys__0__Key: ${GPT_API_KEY:?required}
      Auth__ApiKeys__0__Name: ${GPT_API_KEY_NAME:-prod}
      Auth__AllowedOrigins__0: ${ALLOWED_ORIGIN:-}
      RateLimit__RequestsPerMinute: ${RATE_LIMIT:-30}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=prod,host.name=medelynas}
    ports:
      - "${HOST_PORT:-40480}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      gpt-worker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - medelynas_telemetry

  gpt-worker:
    # Upstream llama.cpp OpenAI-compatible server. No custom image needed —
    # everything we want lives in stock llama-server.
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: gpt-worker
    command:
      - "-m"
      - "/cache/${MODEL_FILE:-Qwen3.6-35B-A3B-UD-Q8_K_XL.gguf}"
      - "-c"
      - "${CONTEXT_SIZE:-32768}"
      - "--threads"
      - "${THREADS:-20}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "9000"
      - "--metrics"
      # --jinja: use the GGUF's embedded chat template, required for tool calls.
      - "--jinja"
      # --flash-attn: faster attention + lower KV memory at long context.
      - "--flash-attn"
      # Q8 KV cache halves memory at negligible quality cost; pays for the 32K context.
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
    volumes:
      - /mnt/tank2/appdata/gpt_api/cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      # Qwen3.6-35B-A3B at Q8 (~38 GB) takes ~60-90s to mmap and warm on cold start;
      # generous start_period keeps the worker out of "unhealthy" while it loads.
      start_period: 240s
    restart: unless-stopped

networks:
  default:
    driver: bridge
  medelynas_telemetry:
    external: true
    name: medelynas_telemetry
