# CPU worker: triage + fallback roster + the gpt-oss-120b top tier (pure-CPU MoE).
# GGUFs: Unsloth UD (Qwen3); ggml-org (gpt-oss MXFP4, reranker). Stage into /cache.
healthCheckTimeout: 300   # 120B cold mmap is the long pole

# Triage stays warm; the heavy models swap among themselves so the 120B and the 14B-fallback
# never co-load (RAM budget), without evicting triage.
groups:
  "resident":
    persistent: true
    swap: false
    members: ["qwen3-1.7b"]
  "heavy":
    swap: true
    exclusive: false
    members: ["gpt-oss-120b", "qwen3-14b", "qwen3-embedding-0.6b", "qwen3-reranker-0.6b"]

models:
  "qwen3-1.7b":            # triage, always warm
    cmd: >
      llama-server --port ${PORT} --model /cache/Qwen3-1.7B-UD-Q4_K_XL.gguf
      --ctx-size 32768 --threads 20 --jinja
    ttl: 0

  "gpt-oss-120b":          # top tier, load-on-demand (~63 GB, 3 shards — pass 00001); thread-limited
    cmd: >
      llama-server --port ${PORT} --model /cache/gpt-oss-120b-mxfp4-00001-of-00003.gguf
      --n-gpu-layers 0 --ctx-size 16384 --threads 16 --jinja
    ttl: 600

  "qwen3-14b":             # workhorse CPU fallback (GPU host offline)
    cmd: >
      llama-server --port ${PORT} --model /cache/Qwen3-14B-UD-Q4_K_XL.gguf
      --ctx-size 32768 --threads 20 --jinja
    ttl: 900

  "qwen3-embedding-0.6b":  # encoder fallback (GPU encoder down)
    cmd: >
      llama-server --port ${PORT} --model /cache/Qwen3-Embedding-0.6B-Q8_0.gguf
      --embeddings --pooling last --ctx-size 8192 --threads 20
    ttl: 600

  "qwen3-reranker-0.6b":   # reranker fallback (GPU encoder down)
    cmd: >
      llama-server --port ${PORT} --model /cache/qwen3-reranker-0.6b-q8_0.gguf
      --reranking --pooling rank --ctx-size 8192 --threads 20
    ttl: 600
