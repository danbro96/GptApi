# llama-swap config — proxies in front of llama-server, swaps models on demand.
# Mounted into the gpt-worker container as /config.yaml.
# Reference: https://github.com/mostlygeek/llama-swap

# Cold-load tolerance for the slowest model (Q8 mmap is the long pole).
healthCheckTimeout: 240

models:
  # Default — fast 8B dense. Loads in ~10s, ~25-40 tok/s on the Xeon. Strong tool
  # calling and HumanEval for size; right pick for Cline / everyday chat.
  "qwen3-8b":
    cmd: >
      llama-server
      --port ${PORT}
      --model /cache/Qwen3-8B-UD-Q4_K_XL.gguf
      --ctx-size 32768
      --threads 20
      --jinja
    ttl: 1800   # unload after 30 min idle so the host can reclaim ~5 GB

  # Medium — Qwen 3.6-35B-A3B at Q4. MoE (3B active) but memory-bandwidth bound on
  # CPU — practically ~5-10 tok/s. Pick when the 8B feels under-powered.
  "qwen3.6-35b-a3b-q4":
    cmd: >
      llama-server
      --port ${PORT}
      --model /cache/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
      --ctx-size 32768
      --threads 20
      --jinja
    ttl: 1800   # unload after 30 min idle so the host can reclaim ~22 GB

  # Heavy, on-demand. Lossless quantization; pick for hard questions or final
  # refactors where peak quality matters.
  "qwen3.6-35b-a3b-q8":
    cmd: >
      llama-server
      --port ${PORT}
      --model /cache/Qwen3.6-35B-A3B-UD-Q8_K_XL.gguf
      --ctx-size 32768
      --threads 20
      --jinja
    ttl: 1800
