# Remote GPU host: GPU workhorse (Vulkan) + a CPU heavy tier on the same box.
# GGUFs: Unsloth UD (Qwen3-14B); ggml-org MXFP4 (gpt-oss-20b). Stage into the host's /cache.
healthCheckTimeout: 180

groups:
  "host":                  # GPU + CPU tiers run concurrently (different hardware)
    swap: false
    members: ["qwen3-14b", "gpt-oss-20b"]

models:
  "qwen3-14b":             # workhorse, kept warm
    cmd: >
      llama-server --port ${PORT} --model /cache/Qwen3-14B-UD-Q4_K_XL.gguf
      --n-gpu-layers 999 --ctx-size 32768 --flash-attn --cache-type-k q8_0 --cache-type-v q8_0 --jinja
    ttl: 0

  "gpt-oss-20b":           # heavy tier on the host CPU, queued
    cmd: >
      llama-server --port ${PORT} --model /cache/gpt-oss-20b-mxfp4.gguf
      --n-gpu-layers 0 --ctx-size 32768 --threads 16 --jinja
    ttl: 1800

  # Vision (optional): Qwen3-VL-8B with --mmproj, load-on-demand.
